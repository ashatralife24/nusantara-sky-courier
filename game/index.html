<!DOCTYPE html>
<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nusantara Sky Courier — Flight Game</title>
<style>
  html, body {
    margin: 0;

<body>
<div id="wrap"><canvas id="game" width="1280" height="800"></canvas></div>

<script src="src/main.js"></script>
</body>
</html>
